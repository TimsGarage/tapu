{{define "login"}}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sign in</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}

			body {
				align-items: center;
				display: flex;
				justify-content: center;
				margin: 0;
				min-height: 100vh;
				padding: 1rem;
			}

			main {
				max-width: 24rem;
				width: 100%;
			}

			form {
				display: grid;
				gap: 1rem;
			}

			label {
				display: grid;
				gap: 0.35rem;
			}

			input,
			button {
				box-sizing: border-box;
				font: inherit;
				padding: 0.75rem;
				width: 100%;
			}

			button {
				cursor: pointer;
			}

			.error {
				background: #8b1a1a;
				color: white;
				padding: 0.75rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Sign in</h1>

			{{if .Error}}
			<p class="error" role="alert">{{.Error}}</p>
			{{end}}

			<form method="post" action="/login">
				<input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />

				<label>
					Username
					<input
						name="username"
						type="text"
						autocomplete="username"
						autocapitalize="none"
						spellcheck="false"
						required
						autofocus
					/>
				</label>

				<label>
					Password
					<input
						name="password"
						type="password"
						autocomplete="current-password"
						required
					/>
				</label>

				<button type="submit">Sign in</button>
			</form>
		</main>
	</body>
</html>
{{end}}

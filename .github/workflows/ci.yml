name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Check formatting
              run: |
                  files="$(gofmt -l .)"
                  if [ -n "$files" ]; then
                    echo "The following files are not formatted:"
                    echo "$files"
                    exit 1
                  fi

            - name: Run vet
              run: go vet ./...

            - name: Run tests
              run: go test -race -cover ./...

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: web/admin/package-lock.json

            - name: Install admin UI dependencies
              working-directory: web/admin
              run: npm ci

            - name: Build admin UI
              working-directory: web/admin
              run: npm run build

            - name: Build commands
              run: |
                  go build ./cmd/iam-server
                  go build ./cmd/iam-migrate
                  go build ./cmd/iam-keygen
                  go build ./cmd/iamctl
                  go build ./examples/go-svelte/cmd/server

            - name: Install govulncheck
              run: go install golang.org/x/vuln/cmd/govulncheck@latest

            - name: Scan Go dependencies
              run: govulncheck ./...

name: personal-iam

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        networks:
            - iam-internal

    migrate:
        build:
            context: ../..
            dockerfile: Dockerfile
        command:
            - /app/iam-migrate
        entrypoint: []
        environment:
            APP_ENV: production
            DATABASE_URL: >-
                postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
            SIGNING_PRIVATE_KEY_PATH: /run/secrets/signing_private_key
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - iam-internal
        restart: "no"

    iam:
        build:
            context: ../..
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            APP_ENV: production
            HTTP_ADDRESS: ":8080"
            DATABASE_URL: >-
                postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
            SIGNING_PRIVATE_KEY_PATH: /run/secrets/signing_private_key
        secrets:
            - signing_private_key
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        ports:
            - "127.0.0.1:8080:8080"
        healthcheck:
            test:
                - CMD
                - wget
                - --quiet
                - --spider
                - http://127.0.0.1:8080/health/ready
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        networks:
            - iam-internal

secrets:
    signing_private_key:
        file: ../../secrets/signing-private.pem

volumes:
    postgres-data:

networks:
    iam-internal:
        driver: bridge
